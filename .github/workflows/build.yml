name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch hev-socks5-tunnel (with submodules)
        run: git clone --recursive --depth 1 --shallow-submodules https://github.com/heiher/hev-socks5-tunnel app/src/main/jni/hev-socks5-tunnel

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Supproxy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Supproxy-apk
          path: Supproxy.apk
