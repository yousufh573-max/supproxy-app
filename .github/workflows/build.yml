name: Build APK

on:
  push:
  workflow_dispatch:
    inputs:
      production:
        description: Build a production-signed APK using the protected production environment
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.production && 'production' || 'debug' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch hev-socks5-tunnel (with submodules)
        working-directory: app/src/main/jni
        run: |
          # Keep this revision in sync with the native declarations in TProxyService.java.
          git init hev-socks5-tunnel
          cd hev-socks5-tunnel || exit 1
          git remote add origin https://github.com/heiher/hev-socks5-tunnel.git
          git fetch --depth 1 origin fc3f90040b8d4b537341c96538669a9b2e35d514
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Install pinned tun2proxy Android libraries
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/tun2proxy/tun2proxy/releases/download/v0.8.7/tun2proxy-android-libs.zip \
            -o "$RUNNER_TEMP/tun2proxy.zip"
          echo "e85d311ade195fe90d6b018585bb86f2f0d8c5ec61f52603b016a6a5d78c6cc4  $RUNNER_TEMP/tun2proxy.zip" | sha256sum --check
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p "app/src/main/jniLibs/$abi"
            unzip -p "$RUNNER_TEMP/tun2proxy.zip" "tun2proxy-android-libs/$abi/libtun2proxy.so" > "app/src/main/jniLibs/$abi/libtun2proxy.so"
          done

      - name: Build debug APK
        if: ${{ !inputs.production }}
        run: gradle assembleDebug --no-daemon

      - name: Prepare debug APK
        if: ${{ !inputs.production }}
        run: cp app/build/outputs/apk/debug/app-debug.apk Supproxy.apk

      - name: Build and verify production APK
        if: ${{ inputs.production }}
        env:
          KEYSTORE_BASE64: ${{ secrets.SUPPROXY_KEYSTORE_BASE64 }}
          SUPPROXY_STORE_PASSWORD: ${{ secrets.SUPPROXY_STORE_PASSWORD }}
          SUPPROXY_KEY_ALIAS: ${{ secrets.SUPPROXY_KEY_ALIAS }}
          SUPPROXY_KEY_PASSWORD: ${{ secrets.SUPPROXY_KEY_PASSWORD }}
          SIGNING_CERT_SHA256: ${{ secrets.SUPPROXY_SIGNING_CERT_SHA256 }}
        run: |
          umask 077
          SUPPROXY_KEYSTORE="$(mktemp "$RUNNER_TEMP/supproxy-signing.XXXXXXXX")"
          export SUPPROXY_KEYSTORE
          trap 'rm -f -- "$SUPPROXY_KEYSTORE"' EXIT
          test -n "$KEYSTORE_BASE64"
          test -n "$SIGNING_CERT_SHA256"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$SUPPROXY_KEYSTORE"
          gradle assembleRelease --no-daemon
          apk=app/build/outputs/apk/release/app-release.apk
          actual=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk" |
            awk '/Signer #1 certificate SHA-256 digest:/ { print $NF }')
          expected=$(printf '%s' "$SIGNING_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "$actual" = "$expected"
          cp "$apk" Supproxy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Supproxy-apk
          path: Supproxy.apk
