plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseSigning = [
    store: System.getenv('SUPPROXY_KEYSTORE'),
    storePassword: System.getenv('SUPPROXY_STORE_PASSWORD'),
    alias: System.getenv('SUPPROXY_KEY_ALIAS'),
    keyPassword: System.getenv('SUPPROXY_KEY_PASSWORD')
]
def hasReleaseSigning = releaseSigning.values().every { it }

android {
    namespace 'com.supproxy.app'
    compileSdk 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'com.supproxy.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            production {
                storeFile file(releaseSigning.store)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.alias
                keyPassword releaseSigning.keyPassword
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig signingConfigs.production
        }
    }

    externalNativeBuild {
        ndkBuild { path file('src/main/jni/Android.mk') }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

tasks.matching { it.name in ['assembleRelease', 'bundleRelease', 'packageRelease'] }.configureEach {
    doFirst {
        if (!hasReleaseSigning) {
            throw new GradleException('Production signing requires all four SUPPROXY signing variables.')
        }
    }
}